<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Web Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#home" class="logo">Portfolio</a>
        <div class="nav-links">
            <a href="#home" class="nav-link">Home</a>
            <a href="#projects" class="nav-link">Projects</a>
            <a href="#contact" class="nav-link">Contact</a>
        </div>
    </nav>

    <main class="hero">
        <div class="badge">
            <span class="badge-dot"></span>
            <span>Available for Projects</span>
        </div>
        <h1>Hi, I'm a Developer</h1>
        <p class="bio">I build clean, responsive websites and explore AI-assisted development. Welcome to my personal portfolio!</p>
        <div class="hero-actions">
            <button id="viewWorkBtn" class="btn btn-primary" type="button">View My Work</button>
            <button id="contactBtn" class="btn btn-secondary" type="button">Contact Me</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
